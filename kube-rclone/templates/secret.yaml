{{- include "kube-rclone.validate" . -}}
{{- if not .Values.rclone.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-rclone.secretName" . }}
  labels:
    {{- include "kube-rclone.labels" . | nindent 4 }}
type: Opaque
data:
  rclone.conf: {{ include "kube-rclone.configContent" . | b64enc | quote }}
{{- end }}
