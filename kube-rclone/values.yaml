# Default values for kube-rclone.

image:
  # The official multi-arch rclone image (amd64, arm64, arm/v7 and more).
  repository: rclone/rclone
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

rclone:
  # Remote to mount, as named in your rclone config. Can include a path, e.g. "gdrive:media".
  remote: "gcache:"
  # Where the remote is mounted on each node (a hostPath).
  path: /mnt/disks/gdrive
  # Mount read-only so nothing in the cluster can delete files on the remote.
  readOnly: true
  # Let other pods and users on the node read the mount.
  allowOther: true
  # Allow mounting over a directory that already has files in it.
  allowNonEmpty: true
  # Node directory for rclone's VFS cache, so the cache survives pod restarts.
  cacheDir: /var/lib/rclone

  # Your rclone config. Pick ONE of these. It is always stored in a Secret,
  # because rclone configs contain OAuth tokens and keys.
  #
  # 1. Use a Secret you manage yourself (recommended for GitOps).
  existingSecret: ""
  existingSecretKey: rclone.conf
  #
  # 2. Pass the config at install time:
  #    helm install rclone simplyzee/kube-rclone --set-file rclone.config=./rclone.conf
  config: ""
  #
  # 3. Legacy: paste it into files/rclone.conf inside the chart (0.1.x behaviour).

  # Extra flags for rclone mount. Options: https://rclone.org/commands/rclone_mount/#options
  additionalArgs: []
    # - --vfs-cache-mode=full
    # - --vfs-cache-max-size=20G
    # - --buffer-size=64M
    # - --dir-cache-time=72h
    # - --vfs-read-chunk-size=128M
    # - --vfs-read-chunk-size-limit=off
    # - --log-level=INFO

  # Extra environment variables for rclone, e.g. RCLONE_* settings.
  env: []
    # - name: RCLONE_LOG_LEVEL
    #   value: INFO

# Restarts the pod if the mount dies (e.g. "transport endpoint is not connected").
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# FUSE mounts with bidirectional propagation need a privileged container.
securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN

# Time to unmount cleanly before the pod is killed.
terminationGracePeriodSeconds: 120

updateStrategy:
  type: RollingUpdate

# Mounts that other workloads depend on are a good fit for system-node-critical.
priorityClassName: ""

podAnnotations: {}
podLabels: {}

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 256Mi
  # limits:
  #   memory: 2Gi

# FUSE mounts only work on Linux nodes, so Windows nodes are skipped.
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
