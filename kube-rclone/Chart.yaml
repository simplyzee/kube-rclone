apiVersion: v2
name: kube-rclone
description: Mount any rclone remote (Google Drive, S3, Dropbox and more) on every Kubernetes node with a DaemonSet
type: application
version: 0.2.2
appVersion: "1.75.2"
kubeVersion: ">=1.21.0-0"
keywords:
  - rclone
  - fuse
  - mount
  - storage
  - daemonset
  - google-drive
  - s3
home: https://github.com/simplyzee/kube-rclone
icon: https://raw.githubusercontent.com/rclone/rclone/master/graphics/logo/logo_symbol/logo_symbol_color_256px.png
sources:
  - https://github.com/simplyzee/kube-rclone
  - https://github.com/rclone/rclone
maintainers:
  - name: simplyzee
    email: zee@simplyzee.dev
    url: https://simplyzee.dev
annotations:
  artifacthub.io/category: storage
  artifacthub.io/license: Apache-2.0
  # Keep in sync with values.yaml; CI checks this matches the rendered chart.
  artifacthub.io/images: |
    - name: rclone
      image: rclone/rclone:1.75.2
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: support
      url: https://github.com/simplyzee/kube-rclone/issues
  artifacthub.io/changes: |
    - kind: fixed
      description: Chart icon, which pointed at a logo rclone.org no longer serves
